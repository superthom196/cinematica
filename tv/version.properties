# The Android versionCode for the TV app: one integer, written down here and
# bumped by hand. Nothing derives it.
#
# It used to be the repository's commit count. That broke the moment the public
# repository was rebuilt from a single commit: the count answers 1, while the
# APK on the 1.0.0 release is versionCode 141 and is installed on real TVs.
# Android refuses to install an APK whose versionCode is below the installed
# one, so every future update would have been rejected as a downgrade. A number
# in a file survives a rewritten history; a counted one cannot.
#
#   * Raise it in the commit that cuts a release. By one is plenty.
#   * Never lower it. 141 is published, so 142 is the floor -- tv-release.yml
#     refuses to publish an APK at or below it.
#   * Development builds between releases keep the last released code. Android
#     allows reinstalling an equal versionCode; only a lower one is refused.
#   * The version NAME is a different thing entirely: it comes from the release
#     tag or CINEMATICA_VERSION. See app/build.gradle.kts.
versionCode=142
