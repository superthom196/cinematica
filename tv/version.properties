# The Android versionCode for the TV app: one integer, written down here and
# bumped by hand. Nothing derives it.
#
# It used to be the repository's commit count, which tied the number that
# decides "is this build newer?" to the shape of the git history. Rebuilding
# this repository rewrote that history, and the count changed underneath the
# app -- so the scheme was replaced by the number below, which survives any
# rewrite because nothing computes it.
#
# It starts at 1. Nothing is installed in the field: this repository's first
# release is the first build anyone can get, so there is no older code to stay
# above and no reason to start anywhere else.
#
#   * Raise it in the commit that cuts a release. By one is plenty.
#   * Never lower it. Android refuses to install an APK whose versionCode is
#     below the one already on the device, so a number that goes down strands
#     every install that took the higher one -- tv-release.yml refuses to
#     publish an APK at or below PUBLISHED_FLOOR for exactly that reason.
#   * Development builds between releases keep the last released code. Android
#     allows reinstalling an equal versionCode; only a lower one is refused.
#   * The version NAME is a different thing entirely: it comes from the release
#     tag or CINEMATICA_VERSION. See app/build.gradle.kts.
versionCode=1
