name: Server Check

on:
  push:
    paths: ['server/**']
  pull_request:
    paths: ['server/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile server.py
        run: python3 -m py_compile server/server.py server/browser_play.py

      - name: Compile sendspin bridge and probe
        run: python3 -m py_compile server/sendspin_bridge.py server/deploy/sendspin_probe.py

      - name: Install ffmpeg
        # The browser packager's tests in server/tests/test_bx_ffmpeg.py skip
        # themselves when there is no ffmpeg, and they are the only coverage
        # that ever sees a real fMP4. Three bugs shipped behind a green suite
        # of hand-built fixtures -- segments that 503'd forever, a timeline
        # counted twice, and segment lengths that a copied video stream
        # cannot actually deliver -- so a runner without ffmpeg would make
        # this job green for exactly the reason it was green before.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | sed -n 1p

      - name: Tests (hifi regressions, browser packager, providers)
        run: python3 -m unittest discover -s server/tests -t server

      - name: Fail if the ffmpeg-backed tests did not actually run
        # A skipped test reads as a pass in the step above, which would put
        # this job back in the state that let three bugs through. Running the
        # one module by name (rather than grepping a second full discover)
        # also means a rename turns into a loud import error here instead of
        # a check that quietly stops checking anything.
        working-directory: server
        run: |
          out=$(python3 -m unittest tests.test_bx_ffmpeg -v 2>&1)
          echo "$out" | tail -n 20
          case "$out" in
            *skipped*)
              echo "::error::test_bx_ffmpeg skipped -- ffmpeg/ffprobe not usable here"
              exit 1 ;;
          esac
          echo "$out" | grep -qE '^Ran [1-9][0-9]* tests?' || {
            echo "::error::test_bx_ffmpeg ran no tests"
            exit 1
          }

      - name: Shell-check deploy scripts and hook
        run: |
          for f in server/deploy/*.sh server/deploy/post-receive; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Shellcheck the shipped scripts
        # The same three files, with the same command, as server-release.yml's
        # Shellcheck step -- deliberately, and that is the whole point of the
        # step being here. It used to run only at release time, so the first
        # thing that ever ran it on v1.0.0's tree was the release itself, which
        # then failed on an SC2015 in install.sh with the tag already pushed.
        #
        # Note whose shellcheck decides: this runner's. A newer one installed
        # locally (0.11 dropped the SC2015 case that stopped that release)
        # reports less, so "clean on my machine" is not the check -- this is.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version | sed -n '2p'
          shellcheck -x server/install.sh server/deploy/package.sh server/deploy/install-sendspin.sh
