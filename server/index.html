/* ---------- player: capability probing ---------- */
// The server owns the probe list -- it builds the identical mime strings when
// picking a source -- so the client never hardcodes it. Union, not
// intersection: MSE and the <video> element genuinely differ in support.
let caps=null;
// Enough to cover the whole supported matrix: CODEC_PROBES carries 18 video
// strings and 12 audio ones, and even a browser that confirms every last one
// of them stays under this. The cap is a runaway guard, not a budget -- set
// low it silently stops pairing after the first video codec or two, which
// leaves exactly the families most likely to need the veto (av01, vp09)
// unprobed. isTypeSupported() is cheap; the only real cost is the caps
// object's size in the play POST, and a full matrix is ~11KB of it.
const PAIR_CAP=256;
async function probeCaps(){
  const result={mse:false,nativeHls:false,types:{}};
  try{
    const v=document.createElement('video');
    result.mse=!!window.MediaSource;
    result.nativeHls=v.canPlayType('application/vnd.apple.mpegurl')!=='';
    const ok=t=>{
      try{ return (window.MediaSource && MediaSource.isTypeSupported(t))
                || ['probably','maybe'].includes(v.canPlayType(t)); }
      catch(e){ return false; }
    };
    const d=await (await fetch('/api/bx/probes', withTimeout(8000))).json();
    const probes=d.probes||[];
    // EVERY probe is published as video/mp4 -- that is the container the
    // browser will really be handed, audio codecs included -- so the mime
    // type cannot say which strings are audio. Splitting on /^video\// put
    // all of them in the video list, left the audio list empty, and so built
    // zero pairs below: the pairing veto in decide() had nothing to read.
    // The server sends the split alongside the list for exactly that reason.
    const audio=new Set(d.audio||[]);
    const vids=[], auds=[];
    probes.forEach(t=>{
      const isOk=ok(t);
      result.types[t]=isOk;
      if(!isOk) return;
      const m=t.match(/codecs="([^"]*)"/);
      if(!m) return;
      if(audio.has(t)) auds.push(m[1]);
      else vids.push(m[1]);
    });
    // video x audio pairs -- the server builds this exact string shape when
    // it picks a source, so the shape has to match exactly.
    let pairs=0;
    for(let i=0;i<vids.length && pairs<PAIR_CAP;i++){
      for(let j=0;j<auds.length && pairs<PAIR_CAP;j++){
        const combo=`video/mp4; codecs="${vids[i]},${auds[j]}"`;
        result.types[combo]=ok(combo);
        pairs++;
      }
    }
  }catch(e){ /* a browser that throws still yields a usable, all-false result */ }
  return result;
}
// Kicked off once, here, as the script runs -- caps is ready long before the
// user can reach a Play button.
probeCaps().then(c=>{ caps=c; }).catch(()=>{ caps={mse:false,nativeHls:false,types:{}}; });

/* ---------- player: overlay ---------- */
const pov=document.getElementById('pov'), pv=document.getElementById('pv'),
      pstate=document.getElementById('pstate'), ptext=document.getElementById('ptext'),
      ptap=document.getElementById('ptap'),
      perr=document.getElementById('perr'), perrtext=document.getElementById('perrtext'),
      pretry=document.getElementById('pretry'), pback=document.getElementById('pback'),
      pnext=document.getElementById('pnext'), pnexttext=document.getElementById('pnexttext'),
      pnextgo=document.getElementById('pnextgo'), pnextstop=document.getElementById('pnextstop'),
      pstop=document.getElementById('pstop'), pkeep=document.getElementById('pkeep'),
      pdone=document.getElementById('pdone'),
      pclose=document.getElementById('pclose');
let pgen=0;                          // guards the poll loop against a stale/abandoned play
let beatTimer=null, waitTimer=null;
let playToken=null, playTokenGen=null;
let lastPlayArgs=null, triedKeys=[]; // candidate keys from the last progress poll's tried_keys --
                                      // authoritative; #pretry sends this back as "skip"
let hls=null;                        // the live hls.js instance, if any -- destroyed on close/replace
let stopPromptOpen=false;            // the Keep my place / Done with this overlay is showing
// The episode the server suggested while this one was being prepared (see
// bx_next_episode), and the countdown offering it. null for a film, for the
// last episode of a show, and whenever AUTOPLAY_NEXT is off server-side.
let nextUp=null, nextTimer=null;
const AUTONEXT_SECONDS=10;

function unlockGesture(){
  // Preparation takes 30-120s -- long past the click's activation window -- so
  // the element is unlocked now, muted, while the gesture is still live. This
  // is what keeps the later pv.play() from being silently blocked.
  pv.muted=true; pv.play().catch(()=>{}); pv.pause(); pv.muted=false;
}

function setPState(text,pct){ pstate.hidden=false; ptext.textContent=text; setProg(['pprog'],pct||0,pct!=null); }
function clearPState(){ pstate.hidden=true; setProg(['pprog'],0,false); }
function showTap(){ pstate.hidden=true; ptap.hidden=false; }
function hideTap(){ ptap.hidden=true; }
function showError(text){ perr.hidden=false; perrtext.textContent=text; pstate.hidden=true; hideTap(); }
function hideError(){ perr.hidden=true; }

function stopHeartbeat(){ if(beatTimer){ clearInterval(beatTimer); beatTimer=null; } }
async function sendBeat(){
  if(!playToken) return;
  const state = pv.ended ? 'ended' : pv.paused ? 'paused' : (pv.readyState<3 ? 'waiting' : 'playing');
  try{
    const r=await fetch('/api/bx/beat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:playToken, gen:playTokenGen, pos:pv.currentTime||0, state})});
    if(r.status===409){          // another device took over
      stopHeartbeat(); pv.pause();
      showError('This playback was taken over by another device.');
    }
  }catch(e){ /* one missed beat is not fatal -- the next one retries */ }
}
function startHeartbeat(){
  stopHeartbeat();
  beatTimer=setInterval(sendBeat, 5000);
}
// Release a session token without waiting for the answer. Used both when the
// page is going away (pagehide, where only sendBeacon survives) and when a
// token turns up for a play the user has already abandoned -- see playHere.
function releaseToken(t,g){
  if(!t) return;
  const body=JSON.stringify({token:t, gen:g});
  try{ if(navigator.sendBeacon('/api/bx/stop', body)) return; }catch(e){}
  try{ fetch('/api/bx/stop',{method:'POST',keepalive:true,
        headers:{'Content-Type':'application/json'},body:body}); }catch(e){}
}
function stopBeacon(){ releaseToken(playToken, playTokenGen); }
// The awaited version, for when something has to happen AFTER the session is
// really gone. sendBeacon cannot be awaited, and autoplay needs the order:
// the server refuses a second browser session while the first still holds the
// player (claim_owner), and the next episode is a second session -- a new
// token, a new job. Beaconing the stop would race the play that follows it.
async function stopSession(){
  if(!playToken) return;
  const t=playToken, g=playTokenGen;
  playToken=null; playTokenGen=null;
  stopHeartbeat();
  try{
    await fetch('/api/bx/stop',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:t, gen:g})});
  }catch(e){ /* the play below will fail loudly enough on its own */ }
}

function cancelNextUp(){
  if(nextTimer){ clearInterval(nextTimer); nextTimer=null; }
  pnext.hidden=true;
}
function offerNextUp(){
  if(!nextUp || !pov.classList.contains('open')) return;
  if(nextTimer) return;             // 'ended' can fire again after a seek back
  const label=nextUp.label;
  let left=AUTONEXT_SECONDS;
  const draw=()=>{ pnexttext.textContent='Next: '+label+' — playing in '+left+'s'; };
  draw();
  pnext.hidden=false;
  nextTimer=setInterval(()=>{
    left--;
    if(left<=0){ playNextUp(); return; }
    draw();
  },1000);
}
async function playNextUp(){
  const n=nextUp;
  cancelNextUp();
  if(!n) return;
  nextUp=null;                      // never offer the same episode twice
  await stopSession();
  playHere('tv', n.id, n.s, n.e, n.label);
}
// PIN_FROM <= position/duration < DONE_AT: stopping here is "still watching",
// so every close path funnels through closePlayer() to offer the choice
// instead of silently dropping (or keeping) the position.
function stopBand(){
  const dur=pv.duration;
  if(!isFinite(dur) || dur<=0) return false;
  const frac=pv.currentTime/dur;
  return frac>=PIN_FROM && frac<DONE_AT;
}
function showStopPrompt(){ stopPromptOpen=true; pv.pause(); pstop.hidden=false; pkeep.focus(); }
function hideStopPrompt(){ stopPromptOpen=false; pstop.hidden=true; }

// Re-fetch the detail endpoint for whatever just played, so the wall tile's
// bar/pin/dim reflects the new position without a reload.
function refreshTileAfterClose(){
  const a=lastPlayArgs; if(!a) return;
  const path = a.kind==='tv' ? '/api/tv/'+a.id : '/api/movie/'+a.id;
  fetch(path).then(r=>r.json()).then(d=>{ if(d && d.shelf) applyShelf(a.id, d.shelf); }).catch(()=>{});
}

function reallyClosePlayer(){
  hideStopPrompt();
  pgen++;                           // abandon any in-flight poll for this play
  // An undestroyed hls.js instance is attached through MediaSource, not src --
  // pv.removeAttribute('src') below does nothing to it, so it keeps fetching
  // segments and keeps the server preparing media for a viewer who has gone.
  if(hls){ try{ hls.destroy(); }catch(e){} hls=null; }
  stopBeacon(); stopHeartbeat();
  cancelNextUp(); nextUp=null;
  clearTimeout(waitTimer); waitTimer=null;
  pov.classList.remove('open');
  pv.pause(); pv.removeAttribute('src'); pv.load();   // release the connection
  playToken=null; playTokenGen=null;
  hideTap(); hideError(); clearPState();
  refreshTileAfterClose();
}
function closePlayer(){
  if(stopPromptOpen) return;        // a stray click while the prompt is up: its own buttons decide
  if(stopBand()) showStopPrompt();
  else reallyClosePlayer();
}
async function keepAndClose(){
  hideStopPrompt();
  await sendBeat();                 // one last beat so the position is recorded before teardown
  reallyClosePlayer();
}
async function dropAndClose(){
  hideStopPrompt();
  const a=lastPlayArgs;
  const job = a ? (a.kind==='tv' ? 'tv:'+a.id+':'+a.s+':'+a.e : a.id) : null;
  if(job){
    try{ await fetch('/api/shelf/drop',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({job})}); }catch(e){ /* close proceeds regardless */ }
  }
  reallyClosePlayer();
}
pkeep.onclick=keepAndClose;
pdone.onclick=dropAndClose;
pclose.onclick=closePlayer;
pback.onclick=closePlayer;
pov.onclick=e=>{
  if(e.target!==pov) return;
  if(stopPromptOpen){ keepAndClose(); return; }   // backdrop click while the prompt is up = accept the focused default
  closePlayer();
};
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape' || !pov.classList.contains('open')) return;
  if(stopPromptOpen){ hideStopPrompt(); pv.play().catch(()=>{}); return; }   // escape again: cancel, keep watching
  closePlayer();
});
addEventListener('pagehide', stopBeacon);
// Hiding the tab is NOT the end of the session. This used to beacon a Stop
// the moment document.hidden went true, so glancing at another tab tore the
// session down server-side -- and nothing restored it on the way back, which
// made switching tabs indistinguishable from stopping the film. A hidden
// tab's timers are throttled to roughly one a minute, which is on the edge of
// the server's BX_IDLE window, so each transition sends a beat of its own:
// it keeps the session fresh going away, and on the way back it is what
// notices promptly that another device took the player over meanwhile.
document.addEventListener('visibilitychange', ()=>{ sendBeat(); });

ptap.onclick=()=>{
  // the gesture expired, not a stream failure -- must not touch setProg,
  // notify(...,true) or the retry path
  hideTap();
  pv.play().catch(e=>showError(e.message||String(e)));
};

// Client-only buffering: a seek into unprepared media, or slow delivery over a
// remote link, surfaces here as the video element's own 'waiting' event, not
// as a server-reported error.
pv.addEventListener('waiting', ()=>{
  if(!pov.classList.contains('open')) return;
  setPState('Buffering…');
  clearTimeout(waitTimer);
  waitTimer=setTimeout(()=>{ ptext.textContent='Still preparing this part of the film…'; }, 20000);
});
['playing','canplay'].forEach(ev=>pv.addEventListener(ev, ()=>{
  clearTimeout(waitTimer); waitTimer=null;
  if(pov.classList.contains('open')) clearPState();
}));

// Autoplay the next episode. The TV does this server-side, off the app's own
// heartbeat (see app_heartbeat); a browser cannot, because nothing tells the
// server the film ended until this page says so -- and by then the tab may be
// closed, hidden, or on a phone that went to sleep. So the page decides, which
// is also what makes Cancel possible.
pv.addEventListener('ended', ()=>{
  if(!pov.classList.contains('open')) return;
  offerNextUp();
});
pnextgo.onclick=()=>{ playNextUp(); };
pnextstop.onclick=()=>{ cancelNextUp(); nextUp=null; };

let hlsPromise=null;
function loadHls(){
  if(window.Hls) return Promise.resolve();
  if(!hlsPromise) hlsPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='/static/hls-1.7.3.min.js';
    s.onload=()=>resolve();
    s.onerror=()=>{ hlsPromise=null; reject(new Error('Could not load the HLS player.')); };   // let a retry re-attempt the load
    document.head.appendChild(s);
  });
  return hlsPromise;
}
async function attachMedia(media){
  // An undestroyed hls.js instance keeps requesting segments, which keeps the
  // server preparing media for a viewer who has gone -- so any instance from
  // a previous play is torn down before this one is set up.
  if(hls){ try{ hls.destroy(); }catch(e){} hls=null; }
  if(media.kind==='direct'){ pv.src=media.url; return; }
  // Safari plays HLS natively; everyone else gets hls.js, loaded lazily --
  // it is 605KB and must never be fetched by a browser that doesn't need it.
  if(caps && caps.nativeHls){ pv.src=media.url; return; }
  await loadHls();
  if(!Hls.isSupported()){
    showError('This browser cannot play prepared video. Try a different browser, or a different source.');
    return;
  }
  hls=new Hls();
  let networkRetried=false, mediaRetried=false;   // reset each attachMedia call, so a later play starts fresh
  hls.on(Hls.Events.ERROR, (evt,data)=>{
    if(!data || !data.fatal) return;              // non-fatal: hls.js recovers on its own
    if(data.type===Hls.ErrorTypes.NETWORK_ERROR){
      if(!networkRetried){ networkRetried=true; hls.startLoad(); }   // a segment can 503 while preparation catches up -- normal and recoverable
      else{ showError('Could not load the video stream.'); if(hls){ try{ hls.destroy(); }catch(e){} hls=null; } }
    } else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){
      if(!mediaRetried){ mediaRetried=true; hls.recoverMediaError(); }
      else{ showError('The video failed to decode.'); if(hls){ try{ hls.destroy(); }catch(e){} hls=null; } }
    } else{
      showError('Could not play the video stream.');
      if(hls){ try{ hls.destroy(); }catch(e){} hls=null; }
    }
  });
  hls.loadSource(media.url);
  hls.attachMedia(pv);
}

async function playHere(kind,id,s,e,title,isRetry,startAt){
  pov.classList.add('open');        // synchronous, before any await -- the click IS the gesture
  unlockGesture();
  const gen=++pgen;
  if(!isRetry){ triedKeys=[]; lastPlayArgs={kind,id,s,e,title,t:(startAt!=null?startAt:null)}; }
  // Whatever was offered belonged to the film that just finished, not this
  // one -- a retry included, since a retry re-prepares and will be told again.
  cancelNextUp(); nextUp=null;
  hideError(); hideTap();
  setPState('Finding a source…');
  let path = kind==='tv' ? '/api/bplay/tv/'+id+'/'+s+'/'+e : '/api/bplay/'+id;
  // Carried through retries via lastPlayArgs.t; autoplay-next never sets it.
  const t = isRetry ? (lastPlayArgs && lastPlayArgs.t) : startAt;
  if(t!=null) path += '?t='+encodeURIComponent(Math.floor(t));
  // Release the previous attempt's session BEFORE asking for another one.
  // The server refuses a second browser session while the first still holds
  // the player (claim_owner), so a retry that merely dropped its old token
  // was answered "Another device is playing" by its own replacement request.
  // playNextUp() already does this; doing it here covers the retry button and
  // anything else that reaches playHere with a session still open.
  await stopSession();
  if(gen!==pgen) return;
  playToken=null; playTokenGen=null;
  const capsVal = caps || {mse:false,nativeHls:false,types:{}};
  const body = isRetry ? {caps:capsVal, skip:triedKeys} : {caps:capsVal};

  let r,d;
  try{
    r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    d=await r.json();
  }catch(err){ if(gen===pgen) showError('Could not reach the server: '+err); return; }
  if(gen!==pgen){
    // The overlay closed -- or another play started -- while this request was
    // in flight. closePlayer() had no token to stop, because this response
    // carries the only copy of it, so without releasing it here the job it
    // started keeps buffering: holding the swarm open, and making
    // claim_owner() refuse every other device for a film nobody is waiting on.
    if(d && d.ok) releaseToken(d.token, d.gen);
    return;
  }
  if(r.status===409){ showError(d.msg||'Another device is playing'); return; }   // do NOT retry
  if(!d.ok){ showError(d.msg||'Could not start playback.'); return; }
  const jobId=d.job;
  playToken=d.token; playTokenGen=d.gen;

  // Reused verbatim from the old TV play() loop: same cadence, same 5-minute
  // deadline, same 10-consecutive-miss bail, same setProg usage, same stage
  // names -- only the terminal branches differ, since this ends in a local
  // <video> rather than on the TV.
  const deadline = Date.now() + 5*60*1000;
  let misses = 0;
  for(;;){
    if(gen!==pgen) return;
    if(Date.now() > deadline || misses >= 10){
      showError('Lost track of playback progress — the server may have restarted.');
      return;
    }
    await new Promise(res=>setTimeout(res,700));
    if(gen!==pgen) return;
    let j;
    try{ j=await (await fetch('/api/progress/'+jobId)).json(); }catch(err){ misses++; continue; }
    if(!j || !j.stage){ misses++; continue; }
    misses=0;
    if(Array.isArray(j.tried_keys)) triedKeys=j.tried_keys;   // authoritative; never accumulated locally
    if(j.stage==='starting') setPState('Finding a source…');
    else if(j.stage==='buffering') setPState('Preparing — '+(j.pct||0)+'%', j.pct||0);
    else if(j.stage==='encoding')  setPState('Converting audio — '+(j.pct||0)+'%', j.pct||0);
    else if(j.stage==='launching') setPState('Starting…');
    else if(j.stage==='playing'){
      clearPState();
      nextUp=(j.media && j.media.next) || null;
      try{ await attachMedia(j.media); }
      catch(err){ showError(err.message||String(err)); return; }
      if(gen!==pgen) return;
      // bplay echoes back the (possibly clamped) offset it actually honoured --
      // seek to that, once, as soon as the element knows its own duration.
      if(typeof d.start_s === 'number'){
        const seekVal=d.start_s;
        const onMeta=()=>{ try{ pv.currentTime=seekVal; }catch(err){} pv.removeEventListener('loadedmetadata', onMeta); };
        pv.addEventListener('loadedmetadata', onMeta);
      }
      try{ await pv.play(); }
      catch(err){
        if(err.name==='NotAllowedError' || err.name==='AbortError') showTap();
        else showError(err.message||String(err));
      }
      startHeartbeat();
      return;
    } else if(j.stage==='error'){
      showError(j.msg||'Playback failed.');
      return;
    }
  }
}
pretry.onclick=()=>{
  if(!lastPlayArgs) return;
  hideError();
  playHere(lastPlayArgs.kind, lastPlayArgs.id, lastPlayArgs.s, lastPlayArgs.e, lastPlayArgs.title, true, lastPlayArgs.t);
};

/* ---------- provider settings / setup ---------- */
// apiSession holds the CSRF token in memory only (never localStorage) --
// the admin cookie itself is HttpOnly and travels with same-origin fetches
// on its own. setupConfigured drives whether the grid or the setup view
// is what main shows; apiClaimed drives claim-form vs login-form.
let apiSession=null, apiClaimed=null, setupConfigured=null, settingsRoot=null;
const ROLES=['catalogue','metadata','streams','channels'];
const ROLE_LABEL={catalogue:'Catalogue',metadata:'Metadata',streams:'Streams',channels:'Channels (optional)'};
const STATUS_LABEL={ready:'Ready',needs_config:'Needs configuration',disabled:'Disabled',test_failed:'Test failed'};
const CSRF_HEADER='X-Cinematica-CSRF';

async function adminFetch(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({},opts.headers);
  if((opts.method||'GET').toUpperCase()!=='GET' && apiSession) opts.headers[CSRF_HEADER]=apiSession;
  const r=await fetch(path,opts);
  if(r.status===401){ const e=new Error('admin required'); e.authFail=true; throw e; }
  return r;
}
async function adminJSON(path,opts){
  const r=await adminFetch(path,opts);
  let d={}; try{ d=await r.json(); }catch(e){}
  return {r,d};
}

function mountSettings(root){ settingsRoot=root; paintSettings(); }

async function paintSettings(){
  const root=settingsRoot; if(!root) return;
  if(apiSession){
    try{
      const {d}=await adminJSON('/api/providers');
      renderProviderDash(root,d);
    }catch(e){
      if(e.authFail){ apiSession=null; return paintSettings(); }
      root.innerHTML='<p class="msgline err">Could not load providers: '+esc(String(e.message||e))+'</p>';
    }
    return;
  }
  if(apiClaimed===null){
    try{ const d=await (await fetch('/api/setup/state')).json(); apiClaimed=!!d.claimed; }
    catch(e){ apiClaimed=false; }
  }
  if(!apiClaimed) renderClaimForm(root); else renderLoginForm(root);
}

async function refreshProviders(){
  if(!settingsRoot) return;
  try{
    const {d}=await adminJSON('/api/providers');
    renderProviderDash(settingsRoot,d);
  }catch(e){
    if(e.authFail){ apiSession=null; return paintSettings(); }
  }
  checkSetupGate();
}

function renderClaimForm(root){
  root.innerHTML=
    '<p style="color:var(--dim);font-size:.85rem">Enter the bootstrap token printed in the server log, and choose an admin password.</p>'
    +'<div class="pf"><label>Bootstrap token</label><input id="claimtok" type="text" autocomplete="off"></div>'
    +'<div class="pf"><label>New password (8+ characters)</label><input id="claimpw" type="password" autocomplete="new-password"></div>'
    +'<div class="msgline" id="claimmsg"></div>'
    +'<button id="claimgo" class="play">Claim admin access</button>';
  const m=root.querySelector('#claimmsg');
  root.querySelector('#claimgo').onclick=async()=>{
    const tok=root.querySelector('#claimtok').value.trim();
    const pw=root.querySelector('#claimpw').value;
    m.textContent=''; m.className='msgline';
    if(!tok || pw.length<8){ m.textContent='Token and an 8+ character password are required.'; m.className='msgline err'; return; }
    try{
      const r=await fetch('/api/setup/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,password:pw})});
      const d=await r.json();
      if(!d.ok){ m.textContent=d.err||'Could not claim.'; m.className='msgline err'; return; }
      apiClaimed=true;
      const lr=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
      const ld=await lr.json();
      if(ld.ok){ apiSession=ld.csrf; paintSettings(); } else { renderLoginForm(root); }
    }catch(e){ m.textContent='Request failed: '+e; m.className='msgline err'; }
  };
}

function renderLoginForm(root){
  root.innerHTML=
    '<div class="pf"><label>Admin password</label><input id="loginpw" type="password" autocomplete="current-password"></div>'
    +'<div class="msgline" id="loginmsg"></div>'
    +'<button id="logingo" class="play">Log in</button>';
  const m=root.querySelector('#loginmsg');
  const go=async()=>{
    const pw=root.querySelector('#loginpw').value;
    m.textContent=''; m.className='msgline';
    try{
      const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
      const d=await r.json();
      if(!d.ok){ m.textContent=d.retry_after?'Too many attempts. Try again in '+d.retry_after+' s.':(d.err||'Incorrect password.'); m.className='msgline err'; return; }
      apiSession=d.csrf; paintSettings();
    }catch(e){ m.textContent='Request failed: '+e; m.className='msgline err'; }
  };
  root.querySelector('#logingo').onclick=go;
  root.querySelector('#loginpw').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); }});
}

function fieldInputHtml(f,curVal){
  const req=f.required?' <span style="color:var(--bad)">*</span>':'';
  const help=f.help?'<div class="pfhelp">'+esc(f.help)+'</div>':'';
  if(f.type==='bool'){
    const checked=curVal===true?' checked':'';
    return '<div class="pf"><label style="display:flex;align-items:center;gap:.4rem;flex-direction:row">'
      +'<input type="checkbox" data-field="'+esc(f.key)+'"'+checked+'> '+esc(f.label)+req+'</label>'+help+'</div>';
  }
  if(f.type==='choice'){
    const chosen=curVal!=null?String(curVal):(f.default!=null?String(f.default):'');
    const opts=(f.choices||[]).map(c=>'<option value="'+esc(c.value)+'"'+(c.value===chosen?' selected':'')+'>'+esc(c.label)+'</option>').join('');
    return '<div class="pf"><label>'+esc(f.label)+req+'</label><select data-field="'+esc(f.key)+'">'+opts+'</select>'+help+'</div>';
  }
  if(f.type==='secret'){
    if(curVal && curVal.set){
      return '<div class="pf"><label>'+esc(f.label)+req+'</label>'
        +'<div class="secretrow" data-field="'+esc(f.key)+'">'
        +'<span style="color:var(--dim);font-size:.82rem">Set ('+esc(curVal.hint)+')</span>'
        +'<button type="button" data-secret-act="replace">Replace</button>'
        +'<button type="button" data-secret-act="clear">Clear</button>'
        +'<input type="password" hidden autocomplete="new-password"></div>'+help+'</div>';
    }
    return '<div class="pf"><label>'+esc(f.label)+req+'</label>'
      +'<input type="password" data-field="'+esc(f.key)+'" autocomplete="new-password" placeholder="'+esc(f.placeholder)+'">'+help+'</div>';
  }
  const itype=f.type==='number'?'number':(f.type==='url'?'url':'text');
  const extra=f.type==='number'?((f.min!=null?' min="'+esc(f.min)+'"':'')+(f.max!=null?' max="'+esc(f.max)+'"':'')):'';
  const val=curVal==null?(f.default==null?'':f.default):curVal;
  return '<div class="pf"><label>'+esc(f.label)+req+'</label>'
    +'<input type="'+itype+'" data-field="'+esc(f.key)+'" value="'+esc(val)+'" placeholder="'+esc(f.placeholder)+'"'+extra+'>'+help+'</div>';
}

function renderConfigureForm(detail,prov){
  const fields=prov.config_fields||[], cfg=prov.config||{};
  detail.innerHTML=(fields.length?fields.map(f=>fieldInputHtml(f,cfg[f.key])).join(''):'<p style="color:var(--dim);font-size:.82rem">This provider has no configuration.</p>')
    +'<div class="msgline"></div>'
    +(fields.length?'<button data-act="cfgsave" class="play">Save configuration</button>':'');
  detail.querySelectorAll('.secretrow').forEach(row=>{
    const inp=row.querySelector('input'), span=row.querySelector('span');
    row.querySelector('[data-secret-act=replace]').onclick=()=>{ delete row.dataset.cleared; inp.hidden=false; inp.focus(); span.textContent='Set ('+span.textContent.replace(/^Set \(|Will be cleared on save\.$/,'').replace(/\)$/,'')+')'; };
    row.querySelector('[data-secret-act=clear]').onclick=()=>{ row.dataset.cleared='1'; inp.hidden=true; inp.value=''; span.textContent='Will be cleared on save.'; };
  });
  const saveBtn=detail.querySelector('[data-act=cfgsave]');
  if(!saveBtn) return;
  saveBtn.onclick=async()=>{
    const values={}, clear=[];
    fields.forEach(f=>{
      if(f.type==='secret'){
        const row=detail.querySelector('.secretrow[data-field="'+f.key+'"]');
        if(row){ if(row.dataset.cleared==='1') clear.push(f.key); else { const inp=row.querySelector('input'); if(!inp.hidden && inp.value) values[f.key]=inp.value; } return; }
        const inp=detail.querySelector('input[data-field="'+f.key+'"]');
        if(inp && inp.value) values[f.key]=inp.value;
        return;
      }
      if(f.type==='bool'){ values[f.key]=detail.querySelector('input[data-field="'+f.key+'"]').checked; return; }
      const el=detail.querySelector('[data-field="'+f.key+'"]');
      if(!el) return;
      values[f.key]=f.type==='number'?(el.value===''?null:Number(el.value)):el.value;
    });
    const m=detail.querySelector('.msgline');
    m.textContent=''; m.className='msgline';
    try{
      const {r,d}=await adminJSON('/api/providers/'+encodeURIComponent(prov.id)+'/config',
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values,clear})});
      if(!r.ok){ m.textContent=d.err||'Could not save.'; m.className='msgline err'; return; }
      m.textContent='Saved.'; m.className='msgline ok';
      await refreshProviders();
    }catch(e){ if(e.authFail){ apiSession=null; paintSettings(); return; } m.textContent='Request failed: '+e; m.className='msgline err'; }
  };
}

function renderUpdateForm(detail,prov){
  const uid='upd-'+prov.id;
  detail.innerHTML=
    '<div class="pf"><label>New manifest URL</label><input type="url" id="'+uid+'-url"></div>'
    +'<button data-act="updgo">Update from URL</button>'
    +'<div class="pf" style="margin-top:.6rem"><label>Or upload a new package (.tar.gz)</label>'
    +'<input type="file" id="'+uid+'-file" accept=".tar.gz,.gz,.tgz"></div>'
    +'<div class="msgline"></div>';
  const m=detail.querySelector('.msgline');
  const doUpdate=async(opts)=>{
    try{
      const {r,d}=await adminJSON('/api/providers/'+encodeURIComponent(prov.id)+'/update',opts);
      if(!r.ok){ m.textContent=d.message||d.err||'Update failed.'; m.className='msgline err'; return; }
      m.textContent='Updated to v'+esc(d.version)+'.'; m.className='msgline ok';
      await refreshProviders();
    }catch(e){ if(e.authFail){ apiSession=null; paintSettings(); return; } m.textContent='Request failed: '+e; m.className='msgline err'; }
  };
  detail.querySelector('[data-act=updgo]').onclick=()=>{
    const url=detail.querySelector('#'+uid+'-url').value.trim();
    m.textContent=''; m.className='msgline';
    if(!url){ m.textContent='Enter a manifest URL.'; m.className='msgline err'; return; }
    doUpdate({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  };
  detail.querySelector('#'+uid+'-file').onchange=async(ev)=>{
    const f=ev.target.files[0]; if(!f) return;
    m.textContent='Uploading…'; m.className='msgline';
    const buf=await f.arrayBuffer();
    doUpdate({method:'POST',headers:{'Content-Type':'application/gzip'},body:buf});
  };
}

function renderProviderDash(root,data){
  const provs=data.providers||[], active=data.active||{};
  root.innerHTML=
    '<div class="psec"><h3>Add a provider</h3>'
    +'<div class="pf"><label>Add-on manifest URL</label><input id="addurl" type="url" placeholder="https://…/manifest.json"></div>'
    +'<button id="addpreview">Preview</button>'
    +'<div id="addpreviewbox"></div>'
    +'<div class="pf" style="margin-top:.7rem"><label>Or upload a package (.tar.gz)</label>'
    +'<input id="addfile" type="file" accept=".tar.gz,.gz,.tgz"></div>'
    +'<div class="msgline" id="addmsg"></div></div>'
    +'<div class="psec"><h3>Active provider per role</h3><div id="activerow"></div>'
    +'<div class="msgline" id="activemsg"></div></div>'
    +'<div class="psec"><h3>Installed providers</h3><div id="provlist">'
    +(provs.length?'':'<p style="color:var(--dim)">No providers installed yet.</p>')+'</div></div>'
    +'<button id="setlogout">Log out</button>';

  const activerow=root.querySelector('#activerow');
  activerow.innerHTML=ROLES.map(role=>{
    const opts=provs.filter(p=>(p.capabilities||[]).includes(role));
    const cur=active[role]||'';
    return '<div class="pf"><label>'+ROLE_LABEL[role]+'</label><select data-role="'+role+'">'
      +'<option value=""'+(cur?'':' selected')+'>None</option>'
      +opts.map(p=>'<option value="'+esc(p.id)+'"'+(p.id===cur?' selected':'')+'>'+esc(p.name)+'</option>').join('')
      +'</select></div>';
  }).join('')+'<button id="activesave" class="play">Save</button>';
  activerow.querySelector('#activesave').onclick=async()=>{
    const m=root.querySelector('#activemsg'); m.textContent=''; m.className='msgline';
    try{
      for(const s of activerow.querySelectorAll('select')){
        const role=s.dataset.role, pid=s.value||null;
        if((active[role]||null)===pid) continue;
        const {r,d}=await adminJSON('/api/providers/active',
          {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,provider_id:pid})});
        if(!r.ok){ m.textContent=d.err||'Could not save.'; m.className='msgline err'; return; }
      }
      m.textContent='Saved.'; m.className='msgline ok';
      await refreshProviders();
    }catch(e){ if(e.authFail){ apiSession=null; paintSettings(); return; } m.textContent='Request failed: '+e; m.className='msgline err'; }
  };

  const addurl=root.querySelector('#addurl'), addpreview=root.querySelector('#addpreview'),
        addbox=root.querySelector('#addpreviewbox'), addmsg=root.querySelector('#addmsg'),
        addfile=root.querySelector('#addfile');
  addpreview.onclick=async()=>{
    const url=addurl.value.trim();
    addmsg.textContent=''; addmsg.className='msgline'; addbox.innerHTML='';
    if(!url){ addmsg.textContent='Enter a manifest URL.'; addmsg.className='msgline err'; return; }
    addpreview.disabled=true; const old=addpreview.textContent; addpreview.textContent='Checking…';
    try{
      const {r,d}=await adminJSON('/api/providers/preview',
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
      if(!r.ok){ addmsg.textContent=d.message||d.err||'Could not read that manifest.'; addmsg.className='msgline err'; return; }
      addbox.innerHTML='<div class="pcard"><div><b>'+esc(d.name)+'</b> <span style="color:var(--dim)">v'+esc(d.version)+'</span></div>'
        +'<div class="mrow">'+(d.capabilities||[]).map(c=>'<span class="chip">'+esc(ROLE_LABEL[c]||c)+'</span>').join('')+'</div>'
        +((d.config&&d.config.length)?'<div class="pfhelp" style="margin-top:.3rem">Will ask for: '+d.config.map(f=>esc(f.label)).join(', ')+'</div>':'')
        +'<button id="addconfirm" class="play" style="margin-top:.6rem">Install '+esc(d.name)+'</button></div>';
      addbox.querySelector('#addconfirm').onclick=async()=>{
        const cbtn=addbox.querySelector('#addconfirm'); cbtn.disabled=true;
        try{
          const {r:r2,d:d2}=await adminJSON('/api/providers/install',
            {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
          if(!r2.ok){ addmsg.textContent=d2.message||d2.err||'Install failed.'; addmsg.className='msgline err'; cbtn.disabled=false; return; }
          addmsg.textContent='Installed '+esc(d2.name)+'.'; addmsg.className='msgline ok';
          addbox.innerHTML=''; addurl.value='';
          await refreshProviders();
        }catch(e){ if(e.authFail){ apiSession=null; paintSettings(); return; } addmsg.textContent='Request failed: '+e; addmsg.className='msgline err'; cbtn.disabled=false; }
      };
    }catch(e){ if(e.authFail){ apiSession=null; paintSettings(); return; } addmsg.textContent='Request failed: '+e; addmsg.className='msgline err'; }
    finally{ addpreview.disabled=false; addpreview.textContent=old; }
  };
  addfile.onchange=async()=>{
    const f=addfile.files[0]; if(!f) return;
    addmsg.textContent='Uploading…'; addmsg.className='msgline';
    try{
      const buf=await f.arrayBuffer();
      const {r,d}=await adminJSON('/api/providers/install',{method:'POST',headers:{'Content-Type':'application/gzip'},body:buf});
      if(!r.ok){ addmsg.textContent=d.message||d.err||'Install failed.'; addmsg.className='msgline err'; return; }
      addmsg.textContent='Installed '+esc(d.name)+'.'; addmsg.className='msgline ok';
      addfile.value=''; await refreshProviders();
    }catch(e){ if(e.authFail){ apiSession=null; paintSettings(); return; } addmsg.textContent='Upload failed: '+e; addmsg.className='msgline err'; }
  };

  const provlist=root.querySelector('#provlist');
  provlist.innerHTML=provs.map(p=>
    '<div class="pitem" data-id="'+esc(p.id)+'"><div class="prow">'
    +'<div><b>'+esc(p.name)+'</b> <span style="color:var(--dim)">v'+esc(p.version)+'</span></div>'
    +'<span class="pbadge '+esc(p.status)+'">'+esc(STATUS_LABEL[p.status]||p.status)+'</span></div>'
    +'<div class="mrow">'+(p.capabilities||[]).map(c=>'<span class="chip">'+esc(ROLE_LABEL[c]||c)+'</span>').join('')+'</div>'
    +(p.status!=='ready'&&p.message?'<div class="msgline err">'+esc(p.message)+'</div>':'')
    +'<div class="pact">'
    +'<button data-act="configure">Configure</button>'
    +'<button data-act="test">Test</button>'
    +'<button data-act="toggle">'+(p.enabled?'Disable':'Enable')+'</button>'
    +'<button data-act="update">Update</button>'
    +'<button data-act="remove">Remove</button></div>'
    +'<div class="pdetail"></div></div>'
  ).join('');
  provlist.querySelectorAll('.pitem').forEach(item=>{
    const pid=item.dataset.id, prov=provs.find(x=>x.id===pid), detail=item.querySelector('.pdetail');
    item.querySelector('[data-act=configure]').onclick=()=>{
      if(detail.dataset.open==='configure'){ detail.dataset.open=''; detail.innerHTML=''; return; }
      detail.dataset.open='configure'; renderConfigureForm(detail,prov);
    };
    item.querySelector('[data-act=update]').onclick=()=>{
      if(detail.dataset.open==='update'){ detail.dataset.open=''; detail.innerHTML=''; return; }
      detail.dataset.open='update'; renderUpdateForm(detail,prov);
    };
    item.querySelector('[data-act=test]').onclick=async(e)=>{
      const btn=e.target; btn.disabled=true; const old=btn.textContent; btn.textContent='Testing…';
      detail.dataset.open='test';
      try{
        const {d}=await adminJSON('/api/providers/'+encodeURIComponent(pid)+'/test',
          {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
        detail.innerHTML = d.ok
          ? '<div class="msgline ok">Test passed'+(d.result&&d.result.name?' — '+esc(d.result.name):'')
            +(d.result&&d.result.resources?' · '+d.result.resources.map(x=>esc(x)).join(', '):'')+'</div>'
          : '<div class="msgline err">'+esc(d.message||'Test failed.')+'</div>';
      }catch(e2){ if(e2.authFail){ apiSession=null; paintSettings(); return; } detail.innerHTML='<div class="msgline err">Request failed: '+esc(String(e2))+'</div>'; }
      finally{ btn.disabled=false; btn.textContent=old; }
    };
    item.querySelector('[data-act=toggle]').onclick=async(e)=>{
      const btn=e.target; btn.disabled=true;
      try{
        const {r,d}=await adminJSON('/api/providers/'+encodeURIComponent(pid)+'/enable',
          {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!prov.enabled})});
        if(!r.ok){ notify(d.err||'Could not update.', true); btn.disabled=false; return; }
        await refreshProviders();
      }catch(e2){ if(e2.authFail){ apiSession=null; paintSettings(); return; } notify('Request failed: '+e2, true); btn.disabled=false; }
    };
    item.querySelector('[data-act=remove]').onclick=async(e)=>{
      if(!confirm('Remove '+prov.name+'? This cannot be undone.')) return;
      const btn=e.target; btn.disabled=true;
      try{
        const {r,d}=await adminJSON('/api/providers/'+encodeURIComponent(pid)+'/remove',
          {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
        if(!r.ok || !d.ok){ notify('Could not remove provider.', true); btn.disabled=false; return; }
        await refreshProviders();
      }catch(e2){ if(e2.authFail){ apiSession=null; paintSettings(); return; } notify('Request failed: '+e2, true); btn.disabled=false; }
    };
  });

  root.querySelector('#setlogout').onclick=async()=>{
    try{ await adminJSON('/api/admin/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}); }catch(e){}
    apiSession=null; paintSettings();
  };
}

function enterSetupMode(){
  document.getElementById('setup').hidden=false;
  document.querySelector('.kwrap').hidden=true;
  document.querySelector('.controls').hidden=true;
  grid.hidden=true;
  document.getElementById('sentinel').hidden=true;
  document.getElementById('loadmore').hidden=true;
  document.getElementById('setbtn').hidden=true;
  mountSettings(document.getElementById('setupbody'));
}
function exitSetupMode(){
  document.getElementById('setup').hidden=true;
  document.querySelector('.kwrap').hidden=false;
  document.querySelector('.controls').hidden=false;
  grid.hidden=false;
  document.getElementById('sentinel').hidden=false;
  document.getElementById('loadmore').hidden=false;
  document.getElementById('setbtn').hidden=false;
  if(!movies.length){ loadGenres(); fetchRow().then(pump); }
}
async function checkSetupGate(){
  try{
    const d=await (await fetch('/api/setup/state')).json();
    apiClaimed=!!d.claimed;
    const nowConfigured=!!d.configured;
    if(nowConfigured && !setupConfigured){ setupConfigured=true; exitSetupMode(); }
    else setupConfigured=nowConfigured;
    document.getElementById('setbtn').hidden=!setupConfigured;
  }catch(e){}
}
async function checkSetup(){
  try{
    const d=await (await fetch('/api/setup/state')).json();
    apiClaimed=!!d.claimed;
    setupConfigured=!!d.configured;
  }catch(e){ setupConfigured=true; return; }   // a hiccup here must not block the whole app
  if(!setupConfigured) enterSetupMode();
  else document.getElementById('setbtn').hidden=false;
}

const setov=document.getElementById('setov'), setbtn=document.getElementById('setbtn');
setbtn.onclick=()=>{ setov.classList.add('open'); mountSettings(document.getElementById('setbody')); };
document.getElementById('setclose').onclick=()=>setov.classList.remove('open');
setov.onclick=e=>{ if(e.target===setov) setov.classList.remove('open'); };
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && setov.classList.contains('open')) setov.classList.remove('open'); });

document.getElementById('stop').onclick=async()=>{
  try{
    const d=await (await fetch('/api/stop',{method:'POST'})).json();
    if(d.ok) msg.textContent='Stopped playback on the TV.';
    else notify('Stop failed: '+d.msg, true);
  }catch(e){ notify('Stop failed: '+e, true); }
};

(async()=>{
  // Purely local rendering first, and nothing below it awaits the network.
  // A hanging /api/genres used to freeze the whole init: the await never
  // resolved so the catch never fired, and the sort menu and the link button --
  // neither of which needs the server at all -- were never drawn.
  renderSorts();
  const setupCheck = checkSetup();   // cheap and local on the server; still awaited
  refreshNet();                      // below, so the grid never appears half-working
  pollNowPlaying();
  await setupCheck;
  if(setupConfigured){
    if(kind==='fav') await loadWatchlist();
    else { loadGenres(); await fetchRow(); pump(); }   // honours any saved genre selection
  }
  new IntersectionObserver(es=>{
    if(es.some(e=>e.isIntersecting)) pump();
  }, {rootMargin:'1200px'}).observe(document.getElementById('sentinel'));
})();
</script></body></html>
