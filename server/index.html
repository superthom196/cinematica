<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematica</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d21;--dim:#5b6270;--line:#e1e4e9;--accent:#2563eb;
      --ok:#15803d;--warn:#b45309;--bad:#b91c1c;--shadow:0 1px 3px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2025;--text:#eceef1;--dim:#9aa2b1;
      --line:#2b2f36;--accent:#5b9dff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 3px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);padding:1.25rem 1rem 4rem;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* ---- mobile first: this is used on a phone ---- */
body{padding:.75rem .6rem 4.5rem}
/* Full-bleed sticky band. The inner wrap keeps content centred, which a sticky
   element with max-width + auto margins cannot do for itself. */
header{
  position:sticky;top:0;z-index:45;
  margin:-.75rem -.6rem 1rem;padding:.75rem .6rem .7rem;
  border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px) saturate(1.15);
  -webkit-backdrop-filter:blur(10px) saturate(1.15);
}
.hwrap{
  max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;
  justify-content:space-between;gap:.6rem;flex-wrap:wrap;
}
/* The wordmark, as the TV app sets it: the name in Alfa Slab One (the face on the ticket-stub
   logo), served from /static so the phone caches it once. Cream on the dark theme is the ticket's
   own lettering; the light theme has no dark ground for cream, so it takes the ticket's red. */
@font-face{font-family:"Alfa Slab One";src:url(/static/alfa-slab-one.ttf) format("truetype");
  font-weight:400;font-style:normal;font-display:swap}
:root{--mark:#c8382b}
@media(prefers-color-scheme:dark){:root{--mark:#f3e6c8}}
.brand{position:relative}
.brand h1{
  margin:0;font-size:1.45rem;font-weight:400;line-height:1;color:var(--mark);
  font-family:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;
  text-transform:uppercase;letter-spacing:.03em;
  /* Alfa Slab One has no ascenders above cap height and the name has no descenders, so the
     box is trimmed to the capitals -- what the row is sized for. */
  padding:.05em 0 .02em;
}
.controls{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;width:100%}
/* Movies | Series: one pill, the chosen half filled, the other greyed inside it. It sits on
   the wordmark's row, to the right of the name, so the controls row below keeps its width for
   the buttons that grow (the link chip becomes "⚡ 42 Mbps" once measured). */
.kwrap{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--card);
  align-self:center;margin-left:auto}
.kwrap button{border:none;border-radius:999px;background:transparent;color:var(--dim);box-shadow:none}
.kwrap button.on{background:var(--accent);color:#fff}
/* A phone is ~360-390px across and the controls must stay on ONE row there: the
   words a button can do without ("Search", "Sort:", the carets) go, and the
   padding tightens. Wider screens get them back. */
@media(max-width:480px){
  .controls{gap:.3rem}
  .controls button{padding:.4rem .45rem}
  .controls .wide{display:none}
}
.status{font-size:.72rem;color:var(--dim);white-space:nowrap;margin-left:auto}
.dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.3rem;vertical-align:middle}
main{max-width:1180px;margin:0 auto}

/* three poster tiles across on a phone; more as the screen grows */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr);gap:.75rem}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(7,1fr)}}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
      box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;
      -webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.97)}
.poster{position:relative;aspect-ratio:2/3;background:#0003}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
/* watched dims the poster only -- title text below stays readable -- and
   un-dims on hover/focus so a quick glance can still confirm what it is */
.poster.watched img{opacity:.4;transition:opacity .15s}
.card:hover .poster.watched img,.card:focus-within .poster.watched img{opacity:1}
.poster .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0004}
.poster .pbar i{display:block;height:100%;background:var(--accent);width:0}
.badge{position:absolute;top:.25rem;left:.25rem;background:#000c;color:#fff;font-size:.58rem;
       padding:.1rem .28rem;border-radius:4px;font-weight:700;letter-spacing:.02em}
.badge.k4{background:#7c3aede6}
.badge.tvbadge{left:auto;right:.25rem;background:var(--accent)}
.rate{position:absolute;bottom:.25rem;right:.25rem;background:#000c;color:#fff;font-size:.62rem;
      padding:.1rem .3rem;border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums}
.rate .bo{color:#7dd3fc;font-weight:600}
.meta{padding:.35rem .4rem .45rem;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.t{font-size:.7rem;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;
   -webkit-box-orient:vertical;overflow:hidden}
.y{font-size:.62rem;color:var(--dim)}
.s{font-size:.6rem;color:var(--dim);font-variant-numeric:tabular-nums;
   white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s.ok{color:var(--ok)}.s.bad{color:var(--bad)}.s.wait{opacity:.6}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
       background:var(--card);color:var(--text);padding:.4rem .5rem;font-size:.76rem;font-weight:600}
button.play{background:var(--accent);color:#fff;border-color:transparent;width:100%;margin-top:.4rem;padding:.35rem .5rem}
button:disabled{opacity:.45;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
     padding:.5rem .6rem;padding-bottom:calc(.5rem + env(safe-area-inset-bottom));
     font-size:.75rem;box-shadow:0 -2px 10px #0003;z-index:50}
/* Same centred column as the header, so the Stop button sits under the controls
   rather than pinned to the far corner of a wide window. */
.bwrap{max-width:1180px;margin:0 auto;display:flex;gap:.5rem;align-items:center}
.bar .msg{display:none}   /* status text removed; the progress bar carries the state */
.np{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--dim);
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npdot{flex:none;width:.55rem;height:.55rem;border-radius:50%;background:var(--dim)}
.npdot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.npdot.pause{background:var(--warn)}
.npdot.bad{background:var(--bad)}
.card .s.thin{color:var(--warn);font-weight:600}
#nptext{overflow:hidden;text-overflow:ellipsis}
.bar button{flex:none;padding:.35rem .5rem;font-size:.72rem}
/* transient toast: the bar stays silent by design, but errors / action-needed
   messages still have to reach the user somehow */
.toasts{position:fixed;left:.6rem;right:.6rem;z-index:100;display:flex;flex-direction:column;gap:.4rem;
  bottom:calc(3.4rem + env(safe-area-inset-bottom));pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--dim);
  border-radius:10px;padding:.55rem .7rem;font-size:.78rem;line-height:1.35;color:var(--text);
  box-shadow:var(--shadow);cursor:pointer;animation:toastin .18s ease-out}
.toast.err{border-left-color:var(--bad);color:var(--bad)}
@keyframes toastin{from{opacity:0;transform:translateY(.35rem)}to{opacity:1;transform:translateY(0)}}
code{font-size:.72rem;background:#8881;padding:.1em .35em;border-radius:4px}
/* buffering progress */
.prog{height:6px;border-radius:999px;background:#8883;overflow:hidden;display:none;width:100%}
.prog.on{display:block}
.prog > i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;
  transition:width .35s ease}
.bar .pwrap{flex:1;display:flex;align-items:center;min-width:0}
/* genre dropdown */
.gwrap{position:relative}
#gbtn{display:flex;align-items:center;gap:.4rem}
#gmenu{position:absolute;z-index:40;top:calc(100% + .35rem);left:0;background:var(--card);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0004;padding:.5rem;
  display:none;grid-template-columns:repeat(2,minmax(130px,1fr));gap:.15rem;min-width:290px;max-height:60vh;overflow:auto}
#gmenu.open{display:grid}
/* Genres is the LAST control on the row, so on a phone its button sits near the right edge and a
   menu hung from its left corner ran half off screen. There is no corner of the button a 290px
   menu can hang from on a 360px screen, so on narrow screens it spans the controls row instead:
   the genre .gwrap stops being the positioning parent and the row is. Neither menu may outgrow
   the viewport anywhere. */
#gmenu,#smenu{max-width:calc(100vw - 1.2rem)}
@media(max-width:600px){
  .controls{position:relative}
  .gwrap.gg{position:static}
  #gmenu{left:0;right:0}
}
#smenu{position:absolute;z-index:40;top:calc(100% + .35rem);left:0;background:var(--card);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0004;padding:.4rem;
  display:none;min-width:230px}
#smenu.open{display:block}
#smenu button{display:block;width:100%;text-align:left;border:none;background:none;padding:.45rem .55rem;
  border-radius:6px;font-size:.82rem}
#smenu button:hover,#smenu button.sel{background:#8881}
#smenu .d{display:block;font-size:.72rem;color:var(--dim);font-weight:400;margin-top:.1rem}
#gmenu .gopt{display:flex;align-items:center;gap:.4rem;font-size:.8rem;padding:.35rem .45rem;
  border:none;background:none;color:var(--text);text-align:left;width:100%;border-radius:6px;font-weight:500}
#gmenu .gmark{display:inline-block;width:1em;font-weight:700}
#gmenu .gopt.inc{color:var(--ok)}
#gmenu .gopt.exc{color:var(--bad);text-decoration:line-through;opacity:.75}
#gmenu label{display:flex;align-items:center;gap:.45rem;font-size:.8rem;padding:.3rem .4rem;
  border-radius:6px;cursor:pointer;white-space:nowrap}
#gmenu label:hover{background:#8881}
#gmenu input{accent-color:var(--accent);margin:0}
.gfoot{grid-column:1/-1;display:flex;gap:.4rem;border-top:1px solid var(--line);padding-top:.45rem;margin-top:.3rem}
.gfoot button{flex:1}
.poster{cursor:pointer}
/* modal */
/* Calibration blocks the page outright: it saturates the link, so anything
   started during it would stall and look broken. Covering the UI is the
   guard -- nothing else can be launched while it runs. */
#cal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;z-index:90;padding:1.5rem}
#cal.open{display:flex}
.calbox{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:1.6rem 1.8rem;max-width:24rem;text-align:center;box-shadow:0 20px 60px #0008}
.spin{width:2.4rem;height:2.4rem;margin:0 auto 1rem;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--accent);animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
#caltitle{font-size:1rem;font-weight:600;margin-bottom:.35rem}
/* Determinate once swarms are being measured; a sliding bar during the speed
   probe, which has no countable steps. */
.calbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:1.1rem}
.calbar i{display:block;height:100%;width:0;background:var(--accent);
  border-radius:3px;transition:width .45s ease}
.calbar.indet i{width:38%;animation:calslide 1.3s ease-in-out infinite}
@keyframes calslide{0%{margin-left:-38%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.calbar.indet i{animation-duration:3s}}
#calstep{font-size:.76rem;color:var(--dim);margin-top:.5rem}
#sov,#setov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:none;
  align-items:flex-start;justify-content:center;z-index:70;padding:1rem}
#sov.open,#setov.open{display:flex}
.smodal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:900px;
  width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px #0007;position:relative;padding:.9rem}
.smodal .srow{display:flex;gap:.5rem;margin:0 2rem .55rem 0}
#sq{flex:1;font:inherit;font-size:1rem;padding:.6rem .7rem;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--text);min-width:0}
#sgo{font:inherit;padding:.6rem .9rem;border-radius:10px;border:1px solid var(--line);
  background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
#sclose,#setclose{position:absolute;top:.45rem;right:.55rem;background:#0001;border:0;border-radius:50%;
  width:1.9rem;height:1.9rem;font-size:1.2rem;line-height:1;color:var(--text);cursor:pointer}
#sstat{color:var(--dim);font-size:.78rem;padding:0 0 .55rem}
.card .nostream{color:var(--bad);font-size:.62rem;font-weight:600}
#ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;z-index:60;padding:1rem}
#ov.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 20px 60px #0007;position:relative}
.mhero{position:relative;aspect-ratio:16/7;background:#0004;overflow:hidden}
.mhero img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.mhero .fade{position:absolute;inset:0;background:linear-gradient(to top,var(--card),transparent 65%)}
.mbody{padding:0 1.25rem 1.25rem;margin-top:-2.5rem;position:relative}
.mtitle{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.mtag{color:var(--dim);font-style:italic;font-size:.85rem;margin-top:.2rem}
.mrow{display:flex;flex-wrap:wrap;gap:.4rem;margin:.7rem 0}
.chip{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:.18rem .55rem;color:var(--dim)}
.mover{font-size:.88rem;line-height:1.55;color:var(--text);margin:.6rem 0 .9rem}
.mstream{font-size:.8rem;color:var(--bad)}
.mstream:not(:empty){background:#8881;border-radius:10px;padding:.7rem .8rem;margin-bottom:.9rem}
.mstream b{font-weight:600}
.spill{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:.25rem .7rem;
  color:var(--text);background:var(--card);cursor:pointer;font-weight:600}
.spill.sel{background:var(--accent);color:#fff;border-color:transparent}
#mepisodes{max-height:14rem;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:.7rem}
.eprow{display:flex;align-items:center;gap:.5rem;padding:.5rem .55rem;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:.82rem;position:relative}
.eprow:last-child{border-bottom:none}
.eprow:hover,.eprow.sel{background:#8881}
.eprow.watched{opacity:.45}
.eprow .ebar{position:absolute;left:0;bottom:0;height:2px;background:var(--accent)}
.eprow .en{font-weight:700;color:var(--dim);min-width:1.5rem}
.eprow .et{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eprow .er{color:var(--dim);font-size:.72rem;white-space:nowrap;flex:none}
.mact{display:flex;flex-wrap:wrap;gap:.5rem}
.mact button{padding:.6rem .9rem;font-size:.85rem}
.mact button.play{flex:1 1 0;width:auto;margin-top:0}
#mfav{white-space:nowrap}
#mfav.on{background:var(--accent);color:#fff;border-color:transparent}
#mstart{color:var(--dim);background:transparent}
#mclose{position:absolute;top:.6rem;right:.6rem;z-index:2;background:#000a;color:#fff;border:none;
  border-radius:999px;width:2rem;height:2rem;font-size:1rem;line-height:1}
/* ---- provider settings / setup ---- */
#setup{padding:.5rem 0 2rem}
#setup h2{font-size:1.05rem;font-weight:600;margin:0 0 1rem;line-height:1.35}
#setpanel{max-width:640px}
#setpanel h2{font-size:1.1rem;margin:0 0 1rem;padding-right:2rem}
.psec{margin-bottom:1.3rem}
.psec h3{font-size:.88rem;font-weight:700;margin:0 0 .6rem;color:var(--text)}
.pf{margin-bottom:.6rem;display:flex;flex-direction:column;gap:.25rem}
.pf label{font-size:.76rem;font-weight:600;color:var(--dim)}
.pf input,.pf select{font:inherit;font-size:.85rem;padding:.45rem .6rem;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--text);min-width:0}
.pf input[type=checkbox]{width:auto;accent-color:var(--accent)}
.pfhelp{font-size:.7rem;color:var(--dim)}
.msgline{font-size:.8rem;margin:.4rem 0;min-height:1em}
.msgline.err{color:var(--bad)}
.msgline.ok{color:var(--ok)}
.pcard{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin-top:.5rem;background:var(--bg)}
.pitem{border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin-bottom:.6rem;background:var(--card)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.pact{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.pact button{font-size:.72rem;padding:.35rem .55rem}
.pdetail:not(:empty){margin-top:.6rem;border-top:1px solid var(--line);padding-top:.6rem}
.pbadge{font-size:.66rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;
  border:1px solid var(--line);white-space:nowrap;color:var(--dim)}
.pbadge.ready{color:var(--ok);border-color:var(--ok)}
.pbadge.needs_config{color:var(--warn);border-color:var(--warn)}
.pbadge.test_failed{color:var(--bad);border-color:var(--bad)}
.secretrow{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.secretrow input{flex:1;min-width:8rem}
/* ---- player overlay ---- */
#pov{position:fixed;inset:0;background:#000;display:none;
  align-items:center;justify-content:center;z-index:80}
#pov.open{display:flex}
#pov .pwrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#pv{max-width:100%;max-height:100%;width:auto;height:auto;background:#000}
#pstate{position:absolute;left:0;right:0;bottom:0;padding:1.2rem 1rem calc(1rem + env(safe-area-inset-bottom));
  background:linear-gradient(to top,#000c,transparent);text-align:center;pointer-events:none}
#ptext{color:#fff;font-size:.85rem;margin-bottom:.5rem;text-shadow:0 1px 3px #000}
#pstate .prog{width:min(60%,20rem);margin:0 auto;background:#fff3}
#ptap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--accent);color:#fff;border:none;border-radius:999px;
  padding:1rem 1.9rem;font-size:1rem;font-weight:700;box-shadow:0 10px 30px #0009}
#perr{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);
  flex-direction:column;align-items:center;justify-content:center;gap:.7rem;padding:1.5rem;text-align:center}
#perr:not([hidden]){display:flex}
#perrtext{color:var(--bad);font-size:.9rem;max-width:26rem;margin:0}
#pnext,#pstop{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);
  flex-direction:column;align-items:center;justify-content:center;gap:.9rem;padding:1.5rem;text-align:center}
#pnext:not([hidden]),#pstop:not([hidden]){display:flex}
#pnexttext,#pstoptext{font-size:1rem;max-width:26rem;margin:0}
.pnextrow{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
#pnextgo,#pkeep{background:var(--accent);color:#fff;border-color:transparent}
#pclose{position:absolute;top:calc(.6rem + env(safe-area-inset-top));right:calc(.6rem + env(safe-area-inset-right));
  z-index:2;background:#000a;color:#fff;border:none;border-radius:999px;width:2.2rem;height:2.2rem;font-size:1.15rem;line-height:1}
@media(prefers-reduced-motion:reduce){#pstate .prog>i{transition:none}}
</style></head><body>
<header><div class="hwrap">
  <div class="brand">
    <h1>Cinematica</h1>
  </div>
  <div class="kwrap"><button id="kmovie" class="on">Movies</button><button id="ktv">Series</button>
    <button id="kfav" title="Watchlist" aria-label="Watchlist">&#9829;</button></div>
  <div class="controls">
    <button id="qbtn" title="Search">&#128269;<span class="wide"> Search</span></button>
    <button id="nbtn" title="Assess the connection">&#9889;</button>
    <button id="setbtn" title="Provider settings" hidden>&#9881;</button>
    <div class="gwrap">
      <button id="sbtn"><span class="wide">Sort: </span><span id="slabel">Top rated</span><span class="wide"> &#9662;</span></button>
      <div id="smenu"></div>
    </div>
    <div class="gwrap gg">
      <button id="gbtn">Genres <span id="gcount"></span><span class="wide">&#9662;</span></button>
      <div id="gmenu"></div>
    </div>
  </div>
</div></header>
<main>
  <div id="setup" hidden>
    <h2>Add a catalogue provider and a stream provider to get started.</h2>
    <div id="setupbody"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="sentinel" style="height:1px"></div>

  <!-- playsinline + webkit-playsinline are mandatory: without them iPhone Safari
       hijacks playback into its own fullscreen player the moment it starts. -->

    <div class="msg" id="msg">Tap a poster to see details.</div></div>
  <button id="stop">Stop</button></div></div>
<script>
const grid=document.getElementById('grid'), msg=document.getElementById('msg');
// Provider titles and genre names go through innerHTML below. A '&' or '<' in a
// title rendered as markup; escaping also means hostile provider data could not
// execute. (mtitle/mover/mtag already use textContent and need nothing.)
const ESCS={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>ESCS[c]);
// Artwork arrives as complete http(s) URLs. contract.py's _url() guarantees it
// -- a provider returns whole URLs, and a bare "/abc.jpg" is dropped rather than
// pasted onto a base core guessed. This page used to prepend one metadata
// service's image CDN, which was right only while the server emitted that one
// service's bare path fragments; once any provider could supply artwork it
// produced "<cdn base><full provider url>" and every poster on the page failed
// to load. The TV app had the same assumption baked in and lost it; this is the
// same removal, here. Escaped because the value is provider-supplied and lands
// in an attribute.
// Mirrors server/shelf.py -- see shelf-contract.md. The client only needs the
// two boundaries that decide what the stop prompt shows.
const PIN_FROM = 0.20, DONE_AT = 0.90;

let movies=[];
let seenIds = new Set();     // every id already placed on (or queued for) the wall this view --
                              // covers both the pinned-prepend dedupe and ordinary paging dedupe
const tiles = new Map();     // id -> {el, poster, m} for in-place tile updates (watched/progress/fav)

function paintPosterShelf(posterEl, shelf){
  posterEl.classList.toggle('watched', !!(shelf&&shelf.watched));
  let bar=posterEl.querySelector('.pbar');
  if(shelf && shelf.progress!=null){
    if(!bar){ bar=document.createElement('div'); bar.className='pbar'; bar.innerHTML='<i></i>'; posterEl.appendChild(bar); }
    bar.firstElementChild.style.width=Math.round(shelf.progress*100)+'%';
  } else if(bar) bar.remove();
}
// Updates the one wall tile in place -- used after a watched/fav toggle, and
// after the player closes, so the bar/pin/dim appears without a reload.
function applyShelf(id, shelf){
  const t=tiles.get(String(id));
  if(t){ t.m.shelf=shelf; paintPosterShelf(t.poster, shelf); }
  const idx=movies.findIndex(x=>String(x.id)===String(id));
  if(idx>=0) movies[idx].shelf=shelf;
}
async function toggleWatched(m){
  const on = !(m.shelf && m.shelf.watched);
  try{
    const r=await fetch('/api/shelf/watched',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:m.id, on})});
    const d=await r.json();
    if(d && d.ok && d.shelf) applyShelf(m.id, d.shelf);
  }catch(e){ /* old server / network hiccup: tile just stays as it was */ }
}

function render(list, append){
  if(!append) grid.innerHTML='';
  (list||movies).forEach(m=>{
    const c=document.createElement('div'); c.className='card';
    const rate = m.imdb ? `<span class="rate">${m.imdb.rating.toFixed(1)}${m.boost?`<span class="bo"> +${m.boost.toFixed(1)}</span>`:''}</span>` : '';
    const tv = m.kind==='tv' ? '<span class="badge tvbadge">TV</span>' : '';
    c.innerHTML=`<div class="poster">${m.poster?`<img loading="lazy" src="${esc(m.poster)}" alt="">`:''}
        <span class="badge" id="b${m.id}" hidden></span>${tv}${rate}</div>
      <div class="meta"><div class="t">${esc(m.title)}</div>
        <div class="y">${esc(m.year||'')}</div>
        <div class="s" id="s${m.id}"></div></div>`;
    // Right-click or a ~550ms touch-hold toggles watched, in place, with no menu.
    let held=false, holdTimer=null;
    const startHold=()=>{ held=false; holdTimer=setTimeout(()=>{ held=true; toggleWatched(m); },550); };
    const cancelHold=()=>clearTimeout(holdTimer);
    c.addEventListener('touchstart', startHold, {passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=>c.addEventListener(ev, cancelHold));
    c.oncontextmenu=e=>{ e.preventDefault(); toggleWatched(m); };
    c.onclick=()=>{ if(held){ held=false; return; } openModal(m); };
    grid.appendChild(c);
    const poster=c.querySelector('.poster');
    tiles.set(String(m.id), {el:c, poster, m});
    paint(m);
    paintPosterShelf(poster, m.shelf);
  });
}


let allGenres=[], streamCache={};
const GKEY='cinematica.genres', SKEY='cinematica.sort', XKEY='cinematica.exclude', KKEY='cinematica.kind';
const SORTS=[
  ['top','Top rated','Best IMDb score, all time'],
  ['balanced','Balanced','Rating plus a recency boost'],
  ['recent','Recent','Last 5 years, best rated first']];
let sortMode=(()=>{ try{ return localStorage.getItem(SKEY)||'top'; }catch(e){ return 'top'; } })();
let kind=(()=>{ try{ return localStorage.getItem(KKEY)||'movie'; }catch(e){ return 'movie'; } })();
// genre include/exclude selections are kept per kind, so switching tabs doesn't
// carry a film genre filter over onto series (and back)
function gkey(){ return kind==='tv' ? GKEY+'.tv' : GKEY; }
function xkey(){ return kind==='tv' ? XKEY+'.tv' : XKEY; }
function loadGenreSel(){
  picked=new Set((()=>{ try{ return JSON.parse(localStorage.getItem(gkey()))||[]; }catch(e){ return []; } })());
  // Recent/Balanced surface a lot of animation because recent animated films rate
  // very highly. Including a genre was possible; excluding one was not.
  banned=new Set((()=>{ try{ return JSON.parse(localStorage.getItem(xkey()))||[]; }catch(e){ return []; } })());
}
let picked=new Set(), banned=new Set();
loadGenreSel();
let offset=0, loading=false, exhausted=false;
const ROWS_AHEAD=3;   // how many rows to keep buffered beyond what is on screen

const gbtn=document.getElementById('gbtn'), gmenu=document.getElementById('gmenu'),
      gcount=document.getElementById('gcount');
const sbtn=document.getElementById('sbtn'), smenu=document.getElementById('smenu');
const kmovie=document.getElementById('kmovie'), ktv=document.getElementById('ktv'), kfav=document.getElementById('kfav');
const npdot=document.getElementById('npdot'), nptext=document.getElementById('nptext');

// The bar carried no state at all, so there was no way to tell what the TV was
// actually doing. Green = playing, amber = paused, grey = idle.
async function pollNowPlaying(){
  try{
    lastNp = await (await fetch('/api/nowplaying')).json();
    paintStatus();
  }catch(e){ lastNp=null; paintStatus(); }
}
setInterval(pollNowPlaying, 6000);

/* every film in the list is already known-playable, so paint from its data */
function paint(m){
  const d = m.stream ? {pick:m.stream.pick, count:m.stream.count, url:m.stream.url}
                     : streamCache[m.id];
  const s=document.getElementById('s'+m.id), b=document.getElementById('b'+m.id);
  if(!d || !d.pick){
    // Pinned/saved items are built from a stored snapshot and may lack
    // stream data entirely -- that is "unknown", never "no stream".
    if(s){ if(m._snap){ s.className='s'; s.textContent=''; } else { s.className='s bad'; s.textContent='no stream'; } }
    return;
  }
  streamCache[m.id]=d;
  const p=d.pick;
  // No size: the picker already chose the best available release, so the figure
  // was plumbing from a decision you never make. Bitrate is the one thing it
  // cannot infer from the tag, so say something only when the pick is a heavy
  // re-encode that will not look like its badge.
  if(s){
    s.className = p.thin ? 's thin' : 's ok';
    s.textContent = p.thin ? 'low bitrate' : '';
  }
  if(b){ b.hidden=false; b.textContent=p.is4k?'4K':(p.tag||'HD'); if(p.is4k) b.classList.add('k4'); }
}

function renderGenres(){
  // three states per genre: off, then included [tick], then excluded [cross]
  gmenu.innerHTML = allGenres.map(g=>{
    const id=String(g.id);
    const st = picked.has(id) ? 'inc' : (banned.has(id) ? 'exc' : 'off');
    const mark = st==='inc' ? '✓' : (st==='exc' ? '✕' : '');
    return `<button class="gopt ${st}" data-g="${id}"><span class="gmark">${mark}</span>${esc(g.name)}</button>`;
  }).join('') +
  `<div class="gfoot"><button id="gclear">Clear</button><button id="gapply" class="play">Apply</button></div>`;
  gmenu.querySelector('#gclear').onclick=()=>{ picked.clear(); banned.clear(); saveGenres(); renderGenres(); applyGenres(); };
  gmenu.querySelector('#gapply').onclick=()=>{ gmenu.classList.remove('open'); applyGenres(); };
  gmenu.querySelectorAll('.gopt').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const id=b.dataset.g;
    if(picked.has(id)){ picked.delete(id); banned.add(id); }
    else if(banned.has(id)){ banned.delete(id); }
    else { picked.add(id); }
    saveGenres(); renderGenres();
  });
  const n = picked.size + banned.size;
  gcount.textContent = n ? `(${n})` : '';
}

let loadGen=0;                     // bumped whenever the view changes
let pending=[];                    // fetched but not yet placed on the grid

// Fetched a row at a time, a few rows ahead of the scroll, so the list grows
// continuously instead of arriving in blocks. A row is whatever the grid is
// currently showing per line: 3 on a phone, 5 or 7 on wider screens.
function cols(){
  const t=getComputedStyle(grid).gridTemplateColumns;
  return Math.max(1, t.split(' ').filter(Boolean).length);
}

async function fetchRow(){
  if(loading || exhausted) return;
  loading=true;
  const gen=loadGen;
  const wasOffsetZero = offset===0;
  // The first request on a cold view resolves real torrents and can take ~30s.
  // Say so: the old loader set this and the rewrite dropped it, which left the
  // page blank and silent on first load.
  const lm0=document.getElementById('loadmore');
  if(!movies.length && !pending.length){
    lm0.textContent=(kind==='tv'?'Finding series':'Finding movies')+'\u2026 (checking what is actually streamable)';
  }
  const q = new URLSearchParams({offset:String(offset), limit:String(cols()), sort:sortMode});
  if(kind==='tv') q.set('kind','tv');
  if(picked.size) q.set('genres',[...picked].join(','));
  if(banned.size) q.set('exclude',[...banned].join(','));
  try{
    const d = await (await fetch('/api/movies?'+q)).json();
    // A sort/genre change while this was in flight means this response describes
    // the view we just left: rendering it painted the old films into the fresh
    // grid and advanced offset past the new view's real first page.
    if(gen!==loadGen) return;
    const raw = d.movies||[];
    // Pinned/offset math is untouched: it counts the real catalogue page,
    // never the top-level `pinned` array (that's a separate, unpaginated list).
    offset += raw.length;
    exhausted = !d.more || raw.length===0;
    const got = raw.filter(x=>!seenIds.has(x.id));
    if(wasOffsetZero && Array.isArray(d.pinned) && d.pinned.length){
      const pins = d.pinned.filter(x=>!seenIds.has(x.id));
      pins.forEach(x=>{ x._snap=true; seenIds.add(x.id); });
      got.forEach(x=>seenIds.add(x.id));
      pending.push(...pins, ...got);
    } else {
      got.forEach(x=>seenIds.add(x.id));
      pending.push(...got);
    }
  }catch(e){
    if(gen===loadGen) document.getElementById('loadmore').textContent='Failed to load more.';
  }
  finally{ if(gen===loadGen) loading=false; }   // a stale page must not clear
}                                               // the live request's flag

// The watchlist tab: no paging, just the one list, prepended/deduped the
// same way pinned items are on the ordinary wall. The server leaves out what
// has been watched since it was saved; a tile marked watched here dims in
// place and is gone on the next load, so the undo stays within reach.
async function loadWatchlist(){
  const lm=document.getElementById('loadmore');
  exhausted=true;
  const gen=loadGen;
  try{
    const d=await (await fetch('/api/shelf')).json();
    if(gen!==loadGen) return;
    const items=(d.items||[]).map(x=>{ x._snap=true; return x; });
    movies=items; items.forEach(x=>seenIds.add(x.id));
    if(items.length){ render(items,false); lm.textContent=''; }
    else lm.textContent='Nothing saved yet \u2014 open a title and press Save for later';
  }catch(e){
    // old server / no route yet: identical to "nothing saved", never an error
    if(gen===loadGen) lm.textContent='Nothing saved yet \u2014 open a title and press Save for later';
  }
}

function drip(){
  const c=cols();
  // Hold back a short row unless the list is genuinely finished. Requests ask
  // for exactly one row, but the server can return fewer, and the column count
  // changes on resize -- either would otherwise leave a ragged gap mid-list.
  if(pending.length < c && !exhausted) return false;
  const n=Math.min(c, pending.length);
  if(!n) return false;
  const row=pending.splice(0,n);
  const first = movies.length===0;
  movies = movies.concat(row);
  render(row, !first);
  const sn=(SORTS.find(x=>x[0]===sortMode)||[])[1]||'Top rated';
  msg.textContent = `${sn} · ${movies.length} ${kind==='tv'?'series':'movies'}`;
  return true;
}

function pump(){
  const sentinel=document.getElementById('sentinel');
  const lm=document.getElementById('loadmore');
  let guard=0;
  // keep roughly a screen and a half of grid below the fold
  while(pending.length && guard++ < 80){
    if(sentinel.getBoundingClientRect().top > innerHeight*1.6) break;
    if(!drip()) break;          // holding back a partial row: stop spinning
  }
  // top the buffer up long before it runs dry, then place whatever arrived
  if(!exhausted && !loading && pending.length < cols()*ROWS_AHEAD)
    fetchRow().then(()=>{ if(pending.length) pump(); });
  lm.textContent = (exhausted && !pending.length)
    ? (movies.length ? `End of the list · ${movies.length} ${kind==='tv'?'series':'movies'}`
                     : 'Nothing playable found — try a different sort or fewer genres.')
    : (movies.length ? '' : (kind==='tv'?'Finding series…':'Finding movies…'));
}

let pumpQueued=false;
addEventListener('scroll', ()=>{
  if(pumpQueued) return;
  pumpQueued=true;
  requestAnimationFrame(()=>{ pumpQueued=false; pump(); });
}, {passive:true});
addEventListener('resize', pump, {passive:true});

function renderSorts(){
  smenu.innerHTML=SORTS.map(([k,n,d])=>
    `<button data-k="${k}" class="${k===sortMode?'sel':''}">${n}<span class="d">${d}</span></button>`).join('');
  smenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    sortMode=b.dataset.k;
    try{ localStorage.setItem(SKEY,sortMode); }catch(e){}
    document.getElementById('slabel').textContent=(SORTS.find(x=>x[0]===sortMode)||[])[1]||'Top rated';
    smenu.classList.remove('open'); renderSorts(); applyGenres();
  });
  document.getElementById('slabel').textContent=(SORTS.find(x=>x[0]===sortMode)||[])[1]||'Top rated';
}
sbtn.onclick=e=>{ e.stopPropagation(); smenu.classList.toggle('open'); };
document.addEventListener('click', e=>{ if(!smenu.contains(e.target)&&e.target!==sbtn) smenu.classList.remove('open'); });

function saveGenres(){
  try{ localStorage.setItem(gkey(), JSON.stringify([...picked]));
       localStorage.setItem(xkey(), JSON.stringify([...banned])); }catch(e){}
}
gbtn.onclick=e=>{ e.stopPropagation(); gmenu.classList.toggle('open'); };
document.addEventListener('click', e=>{ if(!gmenu.contains(e.target)) gmenu.classList.remove('open'); });

async function applyGenres(){
  loadGen++;        // anything in flight belongs to the old view
  loading=false;    // ...and must not block this one from starting
  const names = allGenres.filter(g=>picked.has(String(g.id))).map(g=>g.name);
  const nots  = allGenres.filter(g=>banned.has(String(g.id))).map(g=>g.name);
  msg.textContent = 'Loading…';
  grid.innerHTML=''; movies=[]; pending=[]; offset=0; exhausted=false; streamCache={};
  seenIds=new Set(); tiles.clear();
  document.getElementById('loadmore').textContent = kind==='tv' ? 'Finding series…' : 'Finding movies…';
  await fetchRow(); pump();
}

function withTimeout(ms){ return (typeof AbortSignal!=='undefined' && AbortSignal.timeout)
  ? {signal: AbortSignal.timeout(ms)} : {}; }
function loadGenres(){
  const q = kind==='tv' ? '?kind=tv' : '';
  fetch('/api/genres'+q, withTimeout(20000))
    .then(r=>r.json())
    .then(d=>{ allGenres=d.genres||[]; renderGenres(); })
    .catch(()=>{ /* menu stays empty; the grid does not depend on it */ });
}

/* ---------- Movies / Series / Watchlist toggle ---------- */
function syncKindUI(){
  kmovie.classList.toggle('on', kind==='movie');
  ktv.classList.toggle('on', kind==='tv');
  kfav.classList.toggle('on', kind==='fav');
  // Sort/Genres make no sense against the watchlist -- disabling (rather
  // than a new dimmed-but-clickable style) reuses the existing button:disabled
  // look and, for free, stops the menus from opening at all.
  sbtn.disabled = gbtn.disabled = (kind==='fav');
}
function setKind(k){
  if(k===kind) return;
  kind=k;
  try{ localStorage.setItem(KKEY,kind); }catch(e){}
  syncKindUI();
  loadGenreSel();
  allGenres=[]; renderGenres();
  loadGen++; loading=false;
  grid.innerHTML=''; movies=[]; pending=[]; offset=0; exhausted=false; streamCache={};
  seenIds=new Set(); tiles.clear();
  if(k==='fav'){
    smenu.classList.remove('open'); gmenu.classList.remove('open');
    document.getElementById('loadmore').textContent='Loading your watchlist…';
    loadWatchlist();
    return;
  }
  document.getElementById('loadmore').textContent = kind==='tv' ? 'Finding series…' : 'Finding movies…';
  loadGenres();
  fetchRow().then(pump);
}
kmovie.onclick=()=>setKind('movie');
ktv.onclick=()=>setKind('tv');
kfav.onclick=()=>setKind('fav');
syncKindUI();
if(kind==='tv') document.getElementById('loadmore').textContent='Finding series…';
else if(kind==='fav') document.getElementById('loadmore').textContent='Loading your watchlist…';

/* ---------- link assessment ---------- */
const nbtn=document.getElementById('nbtn');
const calOv=document.getElementById('cal'), calBar=document.getElementById('calbar'),
      calFill=calBar.firstElementChild, calStep=document.getElementById('calstep');
function showCal(on, d){
  const was=calOv.classList.contains('open');
  calOv.classList.toggle('open', !!on);
  if(on && d){
    if(d.calibrating && d.cal_want){
      calBar.classList.remove('indet');
      calFill.style.width = Math.round((d.cal_done/d.cal_want)*100)+'%';
      calStep.textContent = d.cal_done+' of '+d.cal_want+' streams measured';
    } else {
      calBar.classList.add('indet');     // speed probe: no countable steps
      calFill.style.width='';
      calStep.textContent = 'Testing connection speed';
    }
  }
  // Calibration finishing over an empty grid would otherwise sit there: nothing
  // else re-triggers a load once the page's initial fetch is done with.
  if(was && !on && !movies.length && !loading){
    document.getElementById('loadmore').textContent=(kind==='tv'?'Finding series':'Finding movies')+'\u2026';
    fetchRow().then(pump);
  }
}
async function refreshNet(){
  try{
    const d=await (await fetch('/api/netcheck')).json();
    if(d.calibrating || d.busy){
      // A first run measures real swarms before sizing anything, which takes
      // minutes. Say what it is doing and how far along, rather than leaving
      // the page looking merely slow.
      const prog = d.calibrating && d.cal_want
        ? ' '+d.cal_done+'/'+d.cal_want : '';
      showCal(true, d);
      nbtn.dataset.was='1';
      nbtn.textContent='\u26a1 Optimising\u2026'+prog;
      nbtn.title=(d.cal_msg||'Testing internet quality\u2026')
        +'\nMeasuring real download speeds so the first movie is sized correctly.';
      if(d.calibrating)
        msg.textContent='Optimising your connection \u2014 '
          +(d.cal_msg||'measuring\u2026')+' (one time only)';
      else if(d.first_run) msg.textContent='Testing internet quality\u2026';
      setTimeout(refreshNet, 2000);
      return;
    }
    showCal(false);
    if(nbtn.dataset.was && !d.calibrating && !d.busy){
      delete nbtn.dataset.was;
      notify('Link '+(d.http_mbps ?? '?')+' Mbps \u00b7 budget '+(d.mbps ?? '?')
             +' Mbps ('+(d.source||'?')+') \u00b7 '+(d.conns ?? '?')+' connections');
    }
    nbtn.textContent='\u26a1 '+(d.sustain_live ?? '?')+' Mbps';
    nbtn.title='Stream budget '+(d.mbps ?? '?')+' Mbps ('+(d.source||'default')+')'
      +' \u00b7 '+(d.conns ?? '?')+' peer connections'
      +(d.http_mbps?' \u00b7 link tested at '+d.http_mbps+' Mbps':'')
      +(d.n_ordinary?' \u00b7 '+d.n_ordinary+' ordinary swarms measured':'')
      +(d.needs?' \u00b7 '+d.needs+' more needed before it stops estimating':'')
      +(d.age_h!=null?' \u00b7 '+d.age_h+'h ago':'')
      +'\nTap to re-test (needs the link to itself, so stop playback first).';
  }catch(e){
    // A failed poll must never end the chain. The overlay is only dismissed by
    // a successful read, so giving up here left the spinner on screen for good
    // -- and a poll failing is likeliest exactly when it matters, because
    // calibration saturates the very link it is polled over.
    if(calOv.classList.contains('open')) setTimeout(refreshNet, 2000);
  }
}
nbtn.onclick=async()=>{

const sov=document.getElementById('sov'), sq=document.getElementById('sq'),
      sgrid=document.getElementById('sgrid'), sstat=document.getElementById('sstat');

// Built inline rather than through render(): those cards key their badge and
// stream text off element ids, which would collide with the same film already
// sitting on the grid behind this overlay.
function searchCard(m){
  const c=document.createElement('div'); c.className='card';
  const p=m.stream&&m.stream.pick;
  const rate=m.imdb?`<span class="rate">${m.imdb.rating.toFixed(1)}</span>`:'';   // imdb can be null
  const badge=p?`<span class="badge${p.is4k?' k4':''}">${esc(p.is4k?'4K':(p.tag||'HD'))}</span>`:'';
  const tv=m.kind==='tv'?'<span class="badge tvbadge">TV</span>':'';
  c.innerHTML=`<div class="poster">${m.poster?`<img loading="lazy" src="${esc(m.poster)}" alt="">`:''}${badge}${tv}${rate}</div>
    <div class="meta"><div class="t">${esc(m.title)}</div>
      <div class="y">${esc(m.year||'')}</div>
      <div class="s${p&&p.thin?' thin':''}">${p&&p.thin?'low bitrate':''}</div></div>`;
  c.onclick=()=>{
    if(m.stream) streamCache[m.id]=m.stream;   // so Play is live immediately
    closeSearch(); openModal(m);
  };
  return c;
}
function openSearch(){
  sov.classList.add('open'); sq.value=''; sgrid.innerHTML='';
  sq.placeholder = kind==='tv' ? 'Search for a series\u2026' : 'Search for a movie\u2026';
  sstat.textContent='Search a title, a franchise (\u201cjames bond\u201d), or a person.';
  setTimeout(()=>sq.focus(),50);
}
function closeSearch(){ stopSearch(); sov.classList.remove('open'); }
let searchGen=0, es=null;
function stopSearch(){ if(es){ es.close(); es=null; } }
function doSearch(){
  const q=sq.value.trim(); if(!q) return;
  const gen=++searchGen;
  stopSearch();
  sgrid.innerHTML=''; sstat.textContent='Searching\u2026';
  let shown=0, found=0, finished=false;
  // Results are streamed in as each one resolves: a cold franchise search
  // checks ~60 candidates through the stream provider and takes ~25s, but the first
  // playable film lands in about one.
  es=new EventSource('/api/search/stream?q='+encodeURIComponent(q)+'&limit=30'+(kind==='tv'?'&kind=tv':''));
  const stale=()=>gen!==searchGen;
  es.addEventListener('found',e=>{
    if(stale()) return;
    found=JSON.parse(e.data).found;
    sstat.textContent='Checking '+found+' candidate'+(found===1?'':'s')+'\u2026';
  });
  es.addEventListener('movie',e=>{
    if(stale()) return;
    sgrid.appendChild(searchCard(JSON.parse(e.data)));
    shown++;
    sstat.textContent=shown+' found so far\u2026';
  });
  es.addEventListener('done',e=>{
    if(stale()) return;
    const d=JSON.parse(e.data);
    finished=true; stopSearch();
    sstat.textContent = shown
      ? shown+' playable result'+(shown===1?'':'s')
        +(d.checked>shown?' \u00b7 checked '+d.checked+' of '+d.found:'')
      : (d.found
          ? 'Found '+d.found+' title'+(d.found===1?'':'s')+' for \u201c'+q+'\u201d, but none have a playable stream.'
          : 'Nothing found for \u201c'+q+'\u201d.');
  });
  es.addEventListener('fail',e=>{
    if(stale()) return;
    finished=true; stopSearch(); sstat.textContent='Search failed.';
  });
  // EventSource retries automatically, which would silently re-run the whole
  // search; close it instead. A normal end-of-stream also lands here, after
  // 'done' has set finished.
  es.onerror=()=>{
    if(stale()||finished) { stopSearch(); return; }
    stopSearch();
    if(!shown) sstat.textContent='Search failed.';
  };
}
document.getElementById('qbtn').onclick=openSearch;
document.getElementById('sclose').onclick=closeSearch;
document.getElementById('sgo').onclick=doSearch;

let seasonGen=0;
function renderSeasons(seasons, nextEp){
  pendingNextEp = nextEp || null;   // shelf.next -- consumed once, by the matching selectSeason() below
  mseasons.innerHTML = seasons.map(s=>
    `<button class="spill" data-n="${s.n}">${esc(s.name||('Season '+s.n))}${s.episodes?` (${s.episodes})`:''}</button>`
  ).join('');

  mseasons.querySelectorAll('.spill').forEach(b=>b.onclick=()=>selectSeason(Number(b.dataset.n)));
  if(seasons.length){
    const start = (pendingNextEp && seasons.some(s=>s.n===pendingNextEp.s)) ? pendingNextEp.s : seasons[0].n;
    selectSeason(start);
  }
}

async function selectSeason(n){
  if(!modalTv) return;
  modalSeason=n; modalEp=null;
  mseasons.querySelectorAll('.spill').forEach(b=>b.classList.toggle('sel', Number(b.dataset.n)===n));
  const sd=document.getElementById('mstream'), mp=document.getElementById('mplay');
  sd.innerHTML=''; mp.disabled=true; mp.onclick=null;
  mepisodes.hidden=false;
  mepisodes.innerHTML='<div style="padding:.6rem;color:var(--dim);font-size:.8rem">Loading episodes…</div>';
  const gen=++seasonGen, tvId=modalTv.id;
  try{
    const d=await (await fetch('/api/tv/'+tvId+'/season/'+n)).json();
    if(gen!==seasonGen || !modalTv || modalTv.id!==tvId) return;
    const eps=d.episodes||[];
    mepisodes.innerHTML = eps.map(e=>
      `<div class="eprow" data-s="${e.season}" data-e="${e.episode}">
         <span class="en">${e.episode}</span>
         <span class="et">${esc(e.name||('Episode '+e.episode))}</span>
         <span class="er">${e.runtime?e.runtime+' min':''}</span>
       </div>`).join('') || '<div style="padding:.6rem;color:var(--dim);font-size:.8rem">No episodes listed.</div>';
    mepisodes.querySelectorAll('.eprow').forEach(row=>{
      const e=eps.find(x=>String(x.episode)===row.dataset.e);
      if(!e) return;
      paintEpRow(row, e);
      // Right-click or a ~550ms touch-hold toggles that episode's watched state.
      let held=false, holdTimer=null;
      const startHold=()=>{ held=false; holdTimer=setTimeout(()=>{ held=true; toggleEpisodeWatched(tvId,e,row); },550); };
      const cancelHold=()=>clearTimeout(holdTimer);
      row.addEventListener('touchstart', startHold, {passive:true});
      ['touchend','touchmove','touchcancel'].forEach(ev=>row.addEventListener(ev, cancelHold));
      row.oncontextmenu=ev=>{ ev.preventDefault(); toggleEpisodeWatched(tvId,e,row); };
      row.onclick=()=>{ if(held){ held=false; return; } selectEpisode(e); };
    });
    if(pendingNextEp && pendingNextEp.s===n){
      const match=eps.find(x=>x.episode===pendingNextEp.e);
      pendingNextEp=null;
      if(match) selectEpisode(match);
    }
  }catch(e){
    if(gen===seasonGen) mepisodes.innerHTML='<div style="padding:.6rem;color:var(--bad);font-size:.8rem">Could not load episodes.</div>';
  }
}

// One status line. The bottom bar shows what the TV is doing when nothing is
// playing, and what is playing when something is -- rather than a separate
// "TV connected" up top permanently duplicating half of it.
let lastNp=null;
// mm:ss, or h:mm:ss once it needs the hour — only the TV app reports a position
function hms(s){
  s=Math.max(0,Math.floor(s));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60, p=v=>String(v).padStart(2,'0');
  return h ? h+':'+p(m)+':'+p(x) : m+':'+p(x);
}
function paintStatus(){
  const n=lastNp;
  const onFilm = n && n.live && n.title;
  npdot.classList.remove('on','pause','bad');
  if(n && n.live){
    npdot.classList.add(n.paused?'pause':'on');
    // adb can only say playing/paused; the app knows where it actually is
    const pos = (n.source==='app' && n.position_s!=null)
      ? hms(n.position_s)+(n.duration_s ? '/'+hms(n.duration_s) : '') : null;
    if(onFilm){
      const bits=[n.title];
      if(n.tag) bits.push(n.tag);
      // the size ACTUALLY playing: a too-slow candidate is skipped silently
      if(n.gb) bits.push(n.gb+'GB');
      if(n.audio && n.audio!=='?') bits.push(n.audio.toUpperCase()+(n.transcoded?'\u2192AC3':''));
      if(pos) bits.push(pos);
      nptext.textContent=bits.join(' \u00b7 ');
    } else {
      nptext.textContent = (n.paused ? 'Paused' : 'Playing')   // TV busy, title unknown
                           + (pos ? ' \u00b7 '+pos : '');
    }
    return;
  }
  // nothing playing: pollNowPlaying (6s) is now the only thing driving this line.
  nptext.textContent = 'Idle';
}

/* the bar's status text is deliberately invisible, so anything the user actually

function notify(text, isError, urgent){
